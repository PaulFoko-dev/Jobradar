[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Dette antérieure au socle qualité, limitée aux modules qui la contiennent déjà.
"jobradar/ai.py" = ["B904"]
"jobradar/server.py" = ["B904"]
"jobradar/db.py" = ["E741"]
"jobradar/sources/ats.py" = ["E741"]
