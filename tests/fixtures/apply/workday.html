<!doctype html><form data-automation-id="applyForm">
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="resume">CV</label><input id="resume" name="resume" type="file" required>
  <label for="notice">Délai de préavis</label><input id="notice" name="notice" required>
  <fieldset><legend>Êtes-vous autorisé à travailler en France ?</legend>
    <label for="work-yes">Oui</label><input id="work-yes" name="work_authorization" type="radio" value="yes" required>
    <label for="work-no">Non</label><input id="work-no" name="work_authorization" type="radio" value="no" required>
  </fieldset>
  <label><input name="privacy" type="checkbox" required>J'accepte la politique de confidentialité</label>
  <button data-automation-id="bottom-navigation-next-button">Suivant</button>
</form>
